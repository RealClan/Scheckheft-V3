services:
  app:
    build: .
    ports:
      - "5000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/subboss_service.db
      - JWT_SECRET=${JWT_SECRET:-subboss-production-secure-secret}
    restart: always

# Note: Update server.ts to store the DB in /app/data for persistence
